<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NDFC Fixture Alert</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>

  /* ======================================================================
     NDFC FIXTURE ALERT — DESIGN TOKENS
     Same design language as the Monthly Tournament flyer: white/cream
     base, navy + red + a touch of gold, Anton display / Manrope body /
     Space Grotesk accent. You should not need to touch this section —
     only the CONFIG block at the bottom changes per matchday.
     ====================================================================== */
  :root{
    --navy:      #0A1740;
    --navy-soft: #1B2C63;
    --red:       #C8102E;
    --red-dark:  #8E0B21;
    --gold:      #D4AF37;
    --white:     #FFFFFF;
    --cream:     #F7F6F1;
    --ink:       #14141C;
    --ink-soft:  rgba(20,20,28,0.62);
    --line:      rgba(10,23,64,0.14);

    --font-display: 'Anton', 'Arial Narrow', sans-serif;
    --font-body:    'Manrope', -apple-system, sans-serif;
    --font-accent:  'Space Grotesk', 'Manrope', sans-serif;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ background:#1a1a1a; }

  /* ---------- CANVAS: 1080px wide, height grows with fixture count ----------
     Deliberately NOT a fixed height: this template is reused with anywhere
     from one fixture to several, so the canvas sizes itself to the content
     instead of leaving a gap (few fixtures) or overflowing (many fixtures).
     When exporting, screenshot the full height of #canvas rather than a
     fixed 1080x1350 crop. */
  .canvas{
    position:relative;
    width:1080px;
    min-height:1100px;
    overflow:hidden;
    background:var(--white);
    font-family:var(--font-body);
    color:var(--ink);
    margin:0 auto;
    display:flex;
    flex-direction:column;
  }

  .watermark{
    position:absolute;
    top:50%; left:50%;
    transform:translate(-50%,-50%);
    width:720px;
    opacity:0.045;
    pointer-events:none;
  }
  .pitch-texture{
    position:absolute; inset:0;
    background-image:repeating-linear-gradient(
      -35deg,
      rgba(10,23,64,0.025) 0px,
      rgba(10,23,64,0.025) 60px,
      transparent 60px,
      transparent 120px
    );
    pointer-events:none;
  }

  /* ================= HEADER ================= */
  .header{
    position:relative;
    z-index:2;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding-top:44px;
  }
  .header-logo{
    width:76px;
    height:auto;
    margin-bottom:10px;
  }
  .club-name{
    font-family:var(--font-accent);
    font-weight:700;
    font-size:17px;
    letter-spacing:4px;
    color:var(--navy);
    text-transform:uppercase;
  }
  .club-sub{
    margin-top:4px;
    font-family:var(--font-accent);
    font-weight:500;
    font-size:11px;
    letter-spacing:2.5px;
    color:var(--ink-soft);
    text-transform:uppercase;
  }

  /* ================= HEADLINE (the main event) ================= */
  .headline-zone{
    position:relative;
    z-index:2;
    text-align:center;
    padding:30px 60px 0;
  }
  .alert-eyebrow{
    display:inline-flex;
    align-items:center;
    gap:10px;
    font-family:var(--font-accent);
    font-weight:700;
    font-size:15px;
    letter-spacing:3px;
    color:var(--red);
    text-transform:uppercase;
  }
  .alert-eyebrow .bolt{ font-size:18px; line-height:1; }
  #alertHeadlineEl{
    margin-top:6px;
    font-family:var(--font-display);
    font-size:98px;
    line-height:0.92;
    color:var(--navy);
    text-transform:uppercase;
    letter-spacing:1px;
  }
  #alertHeadlineEl .accent{ color:var(--red); }

  /* tournament name pill — present but visually secondary to the
     FIXTURE ALERT headline, since the tournament changes week to week */
  .tourney-pill{
    display:inline-block;
    margin-top:18px;
    padding:10px 26px;
    border:2px solid var(--gold);
    border-radius:999px;
    background:rgba(212,175,55,0.08);
  }
  #tournamentNameEl{
    font-family:var(--font-accent);
    font-weight:700;
    font-size:19px;
    letter-spacing:1.5px;
    color:var(--navy-soft);
  }

  /* ================= DATE / LOCATION BAR ================= */
  .info-bar{
    position:relative;
    z-index:2;
    margin:28px 60px 0;
    background:var(--navy);
    border-radius:10px;
    padding:22px 32px;
    display:flex;
    align-items:center;
    gap:24px;
    box-shadow:0 14px 28px -12px rgba(10,23,64,0.4);
  }
  .info-item{
    display:flex;
    align-items:center;
    gap:12px;
    flex:1;
  }
  .info-icon{
    flex:0 0 auto;
    width:34px; height:34px;
  }
  .info-icon svg{ width:100%; height:100%; }
  .info-text .i-label{
    font-family:var(--font-accent);
    font-weight:600;
    font-size:11px;
    letter-spacing:2px;
    color:rgba(255,255,255,0.55);
    text-transform:uppercase;
  }
  .info-text .i-value{
    font-family:var(--font-body);
    font-weight:700;
    font-size:17px;
    color:var(--white);
    line-height:1.25;
    margin-top:2px;
  }
  .info-divider{
    width:1px;
    align-self:stretch;
    background:rgba(255,255,255,0.18);
  }

  /* ================= FIXTURES ================= */
  .section-label{
    display:flex;
    align-items:center;
    gap:16px;
    margin:34px 60px 0;
  }
  .section-label .line{ flex:1; height:2px; background:var(--line); }
  .section-label span{
    font-family:var(--font-accent);
    font-weight:700;
    font-size:15px;
    letter-spacing:3px;
    color:var(--navy);
    text-transform:uppercase;
    white-space:nowrap;
  }

  .fixtures{
    position:relative;
    z-index:2;
    margin:20px 60px 0;
    display:flex;
    flex-direction:column;
    gap:18px;
  }
  .fixture-card{
    background:var(--cream);
    border:1px solid var(--line);
    border-left:6px solid var(--red);
    border-radius:8px;
    padding:20px 26px;
  }
  .fixture-meta{
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom:12px;
  }
  .fixture-time{
    font-family:var(--font-accent);
    font-weight:700;
    font-size:16px;
    color:var(--navy);
    letter-spacing:0.5px;
  }
  .fixture-field{
    font-family:var(--font-accent);
    font-weight:700;
    font-size:11px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--white);
    background:var(--red);
    padding:4px 11px;
    border-radius:4px;
  }
  .fixture-teams{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
  }
  .team-name{
    flex:1;
    font-family:var(--font-body);
    font-weight:700;
    font-size:22px;
    line-height:1.2;
    color:var(--ink);
  }
  .team-name.right{ text-align:right; }
  .team-name.is-ndfc{ color:var(--navy); font-weight:800; }
  .vs-tag{
    flex:0 0 auto;
    font-family:var(--font-display);
    font-size:18px;
    color:var(--ink-soft);
    letter-spacing:1px;
  }

  /* ================= FOOTER ================= */
  .footer{
    position:relative;
    z-index:2;
    margin-top:56px;
    text-align:center;
    padding:34px 60px 52px;
  }
  .footer-divider{
    height:1px;
    background:linear-gradient(90deg, transparent, var(--gold) 20%, var(--gold) 80%, transparent);
    opacity:0.6;
    margin-bottom:24px;
  }
  .footer-tagline{
    font-family:var(--font-accent);
    font-weight:700;
    font-size:14px;
    letter-spacing:3px;
    color:var(--navy);
    text-transform:uppercase;
  }
  .footer-tagline .dot{ color:var(--red); margin:0 10px; }
  .footer-handle{
    margin-top:8px;
    font-family:var(--font-body);
    font-weight:600;
    font-size:13px;
    color:var(--ink-soft);
  }
</style>
</head>

  date:           "October 3",

function isNDFC(name){
  return /nepal\s*dallas/i.test(name);

function renderFixtures(list){
  const wrap = document.getElementById('fixturesEl');
  wrap.innerHTML = '';
  list.forEach(fx => {
    const card = document.createElement('div');
    card.className = 'fixture-card';
    const aClass = isNDFC(fx.teamA) ? 'team-name is-ndfc' : 'team-name';
    const bClass = isNDFC(fx.teamB) ? 'team-name right is-ndfc' : 'team-name right';
    card.innerHTML = `
      <div class="fixture-meta">
        <div class="fixture-time">${fx.time}</div>
        <div class="fixture-field">${fx.field}</div>
      </div>
      <div class="fixture-teams">
        <div class="${aClass}">${fx.teamA}</div>
        <div class="vs-tag">VS</div>
        <div class="${bClass}">${fx.teamB}</div>
      </div>`;
    wrap.appendChild(card);
  });
}

function applyConfig(cfg){
  document.getElementById('tournamentNameEl').textContent = cfg.tournamentName;
  document.getElementById('dateEl').textContent = cfg.date;
  document.getElementById('locationEl').textContent = cfg.location;
  document.getElementById('handleEl').textContent = cfg.socialHandle;
  renderFixtures(cfg.fixtures);
}

applyConfig(CONFIG);
</script>

</body>
</html>
